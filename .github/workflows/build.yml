name: Build UIDHide LKM
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KERNEL_VERSION: 6.6.118
      ARCH: arm64
      CLANG_BRANCH: clang-r498229b
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download AOSP Clang
        run: |
          git clone https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/${{ env.CLANG_BRANCH }} clang
          echo "PATH=$PWD/clang/bin:$PATH" >> $GITHUB_ENV

      - name: Download GKI kernel source ${{ env.KERNEL_VERSION }}
        run: |
          git clone --depth=1 --branch=${{ env.KERNEL_VERSION }} https://android.googlesource.com/kernel/common kernel
          cd kernel
          cp ../6.6.118.config .config
          make LLVM=1 ARCH=${{ env.ARCH }} olddefconfig

      - name: Compile uidhide.ko
        run: |
          KDIR=$PWD/kernel
          make -C ${KDIR} M=$PWD LLVM=1 ARCH=${{ env.ARCH }} modules

      - name: Pack KSU module zip
        run: |
          mkdir -p out
          cp uidhide.ko out/
          cat > out/module.prop <<EOF
id=uidhide
name=UIDHide
version=1.0
versionCode=1
author=longze777
description=UID hide LKM module
EOF
          cat > out/post-fs-data.sh <<EOF
#!/system/bin/sh
insmod \${MODDIR}/uidhide.ko
EOF
          chmod +x out/post-fs-data.sh
          cd out
          zip -r uidhide.zip .

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/uidhide.zip
